server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
